<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Історія — SoundMood</title>
    <link rel="stylesheet" href="css/style.css"/>
    <style>
        .history-item {
            display:flex;align-items:center;gap:16px;
            padding:14px 0;border-bottom:1px solid var(--border);
            transition:all var(--transition);
        }
        .history-item:last-child { border-bottom:none; }
        .history-item:hover { background:transparent; }
        .h-cover {
            width:44px;height:44px;border-radius:10px;flex-shrink:0;
            background:var(--accent-glow);border:1px solid rgba(108,99,255,0.25);
            display:grid;place-items:center;
        }
        .h-info { flex:1;min-width:0; }
        .h-title { font-weight:600;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
        .h-meta { font-size:0.78rem;color:var(--text-muted);margin-top:2px; }
        .h-actions { display:flex;gap:6px; }
        .filter-bar { display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:24px; }
    </style>
</head>
<body>
<div class="page-wrapper">

    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-logo">
                <div class="logo-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
                SoundMood
            </a>
            <div class="nav-links">
                <a href="index.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Головна</span></a>
                <a href="settings.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Налаштування</span></a>
                <a href="generator.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg><span>Генератор</span></a>
                <a href="result.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>Результат</span></a>
                <a href="history.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 0 .5-3.5"/><polyline points="3 4 3 11 10 11"/></svg><span>Історія</span></a>
                <a href="about.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>Про нас</span></a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">

            <div class="fade-up" style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:32px;flex-wrap:wrap;gap:16px;">
                <div>
                    <h1 class="page-title">Історія</h1>
                    <p class="page-subtitle">Всі раніше згенеровані саундтреки</p>
                </div>
                <button class="btn btn-ghost btn-sm" onclick="clearHistory()" style="margin-top:8px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                    Очистити
                </button>
            </div>

            <!-- Stats -->
            <div class="grid-3 fade-up fade-up-1" style="margin-bottom:28px;">
                <div class="card card-sm" style="text-align:center;">
                    <div style="font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;" id="statTotal">0</div>
                    <div style="font-size:0.78rem;color:var(--text-muted);margin-top:4px;">Всього треків</div>
                </div>
                <div class="card card-sm" style="text-align:center;">
                    <div style="font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;color:var(--accent);" id="statGenre">—</div>
                    <div style="font-size:0.78rem;color:var(--text-muted);margin-top:4px;">Улюблений жанр</div>
                </div>
                <div class="card card-sm" style="text-align:center;">
                    <div style="font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;color:var(--accent-2);" id="statToday">0</div>
                    <div style="font-size:0.78rem;color:var(--text-muted);margin-top:4px;">Сьогодні</div>
                </div>
            </div>

            <!-- Filter -->
            <div class="filter-bar fade-up fade-up-2">
                <input type="text" class="form-control" placeholder="🔍 Пошук по назві..." style="max-width:260px;" id="searchInput" oninput="renderHistory()"/>
                <select class="form-control" style="max-width:160px;" id="filterGenre" onchange="renderHistory()">
                    <option value="">Всі жанри</option>
                    <option>Ambient</option>
                    <option>Electronic</option>
                    <option>Jazz</option>
                    <option>Classical</option>
                    <option>Rock</option>
                    <option>Lo-Fi</option>
                    <option>Cinematic</option>
                    <option>Pop</option>
                </select>
            </div>

            <!-- List -->
            <div class="card fade-up fade-up-2">
                <div id="historyList"></div>
            </div>

            <div class="fade-up fade-up-3" style="margin-top:20px;text-align:center;">
                <a href="generator.html" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    Створити новий трек
                </a>
            </div>

        </div>
    </main>

    <footer><div class="container"><p>© 2025 SoundMood</p></div></footer>
</div>

<div class="toast"></div>
<script src="js/main.js"></script>
<script>
    // Demo data
    const DEMO = [
        { id:1, title:'Ambient Dream #1', genre:'Ambient', bpm:85, mood:'Спокійний', date:'26.05.2025' },
        { id:2, title:'Electronic Boost', genre:'Electronic', bpm:128, mood:'Енергійний', date:'25.05.2025' },
        { id:3, title:'Jazz Morning', genre:'Jazz', bpm:95, mood:'Радісний', date:'24.05.2025' },
        { id:4, title:'Cinematic Tension', genre:'Cinematic', bpm:72, mood:'Напружений', date:'23.05.2025' },
        { id:5, title:'Lo-Fi Study', genre:'Lo-Fi', bpm:80, mood:'Задумливий', date:'22.05.2025' },
    ];

    function allTracks() {
        const stored = getHistory();
        return stored.length ? stored : DEMO;
    }

    function renderHistory() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const gf = document.getElementById('filterGenre').value;
        let tracks = allTracks().filter(t =>
            (!q || t.title.toLowerCase().includes(q) || t.mood?.toLowerCase().includes(q)) &&
            (!gf || t.genre === gf)
        );

        const list = document.getElementById('historyList');
        if (!tracks.length) {
            list.innerHTML = `<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 0 .5-3.5"/></svg><p>Треків не знайдено</p></div>`;
            return;
        }

        const icons = { Ambient:'🌊', Electronic:'⚡', Jazz:'🎷', Classical:'🎻', Rock:'🎸', 'Lo-Fi':'☕', Cinematic:'🎬', Pop:'🎤' };
        list.innerHTML = tracks.map((t,i) => `
      <div class="history-item" style="animation:fadeUp 0.3s ease ${i*0.04}s both;">
        <div class="h-cover"><span style="font-size:1.2rem;">${icons[t.genre]||'🎵'}</span></div>
        <div class="h-info">
          <div class="h-title">${t.title}</div>
          <div class="h-meta">${t.genre} · ${t.bpm} BPM · ${t.mood||''} · ${t.date}</div>
        </div>
        <div class="h-actions">
          <button class="btn btn-ghost btn-sm" title="Відтворити" onclick="showToast('Відтворення: ${t.title}','▶')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
          </button>
          <button class="btn btn-ghost btn-sm" title="Видалити" onclick="deleteTrack(${t.id}, this)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        </div>
      </div>
    `).join('');

        // Stats
        const total = allTracks().length;
        document.getElementById('statTotal').textContent = total;
        const genres = allTracks().map(t=>t.genre);
        const topGenre = genres.sort((a,b) => genres.filter(g=>g===b).length - genres.filter(g=>g===a).length)[0] || '—';
        document.getElementById('statGenre').textContent = topGenre;
        const today = new Date().toLocaleDateString('uk-UA');
        document.getElementById('statToday').textContent = allTracks().filter(t=>t.date===today).length;
    }

    function deleteTrack(id, el) {
        el.closest('.history-item').style.opacity = '0.3';
        setTimeout(() => { renderHistory(); showToast('Трек видалено','🗑'); }, 300);
    }

    function clearHistory() {
        if (confirm('Очистити всю історію?')) {
            localStorage.removeItem('sg_history');
            renderHistory();
            showToast('Історію очищено','✓');
        }
    }

    renderHistory();
</script>
</body>
</html>
